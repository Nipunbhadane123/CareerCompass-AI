version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: careercompass-db
    environment:
      POSTGRES_USER: careercompass
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: careercompass_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careercompass -d careercompass_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: careercompass-backend
    environment:
      - ENVIRONMENT=production
      - PROJECT_NAME=CareerCompass AI
      - DATABASE_URL=postgresql://careercompass:secretpassword@db:5432/careercompass_db
      - SECRET_KEY=production-secret-key-replace-with-secure-value
      - BACKEND_CORS_ORIGINS=["http://localhost:3000","http://localhost:5173"]
      - AI_PROVIDER=deterministic
    ports:
      - "8000:8000"
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: careercompass-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_uploads:
